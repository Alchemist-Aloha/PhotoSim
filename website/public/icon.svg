<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PhotoSim icon: green mountains under a sunset sky with a cream cloud, framed by thick cream viewfinder brackets">
  <title>PhotoSim</title>
  <defs>
    <!-- Sunset sky: deep blue into warm horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B5A96"/>
      <stop offset="0.42" stop-color="#7CB0D7"/>
      <stop offset="0.72" stop-color="#F8C58C"/>
      <stop offset="1" stop-color="#FFDCA8"/>
    </linearGradient>
    <!-- Low sun glow behind the ridge -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFEAC2" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#FFEAC2" stop-opacity="0"/>
    </radialGradient>
    <!-- App icon mask: rounded square -->
    <clipPath id="mask">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#mask)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="250" cy="215" r="170" fill="url(#glow)"/>

    <!-- Broad, uneven ridges leave open valleys instead of repeating waves. -->
    <path fill="#A9BEAA" d="M -24 300 C 22 282 50 250 92 260 C 140 271 174 302 224 298 C 282 294 320 251 364 254 C 420 258 466 290 536 272 L 536 536 H -24 Z"/>
    <path fill="#7C9F82" d="M -24 344 C 30 333 62 296 108 300 C 158 304 198 343 252 335 C 310 327 346 288 390 294 C 442 300 480 329 536 318 L 536 536 H -24 Z"/>

    <!-- An off-centre summit, broken shoulder and long descending flank. -->
    <path fill="#1D3D2A" d="M -24 480 C 38 450 72 392 112 365 L 146 345 L 174 298 L 192 286 L 222 238 Q 226 231 233 234 L 256 261 L 276 300 C 303 327 320 326 348 344 C 392 370 448 373 536 430 L 536 536 H -24 Z"/>

    <!-- Cloud: flat cream, no outline -->
    <path fill="#FFF6E6" d="M 310 142 C 293 142 280 129 280 113 C 280 98 291 85 306 83 C 309 62 327 46 348 46 C 369 46 386 60 392 78 C 394 83 399 84 404 82 C 408 80 411 78 414 75 C 426 64 446 82 446 103 C 446 105 446 107 445 109 C 460 112 470 125 470 137 C 470 140 468 142 464 142 Z"/>

    <!-- Viewfinder brackets: thick cream corners framing the simulated shot -->
    <path d="M 62 166 V 62 H 166" fill="none" stroke="#FFF6E6" stroke-width="30" stroke-linejoin="round" stroke-linecap="butt"/>
    <path d="M 450 346 V 450 H 346" fill="none" stroke="#FFF6E6" stroke-width="30" stroke-linejoin="round" stroke-linecap="butt"/>
  </g>
</svg>
