name: Build and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  FLUTTER_VERSION: '3.47.6'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Release metadata and tag validation
        id: metadata
        run: python3 tool/build_release.py metadata >> "$GITHUB_OUTPUT"
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test
      - run: python3 -m unittest discover -s tool -p 'test_*.py'

  linux:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-13-dev dpkg-dev libarchive-tools zstd desktop-file-utils file
      - name: Build deb, pacman and AppImage
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          python3 tool/build_release.py linux
          dpkg-deb --info build/dist/*.deb
          bsdtar -tf build/dist/*.pkg.tar.zst > build/package-files.txt
          grep -Fx '.PKGINFO' build/package-files.txt
          grep -Fx 'usr/lib/photosim/photosim' build/package-files.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: build/dist/PhotoSim-*
          if-no-files-found: error

  android:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build per-ABI APKs (release tags require a persistent signing key)
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          ANDROID_KEYSTORE_BASE64: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          PHOTOSIM_KEYSTORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          PHOTOSIM_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_KEY_ALIAS || '' }}
          PHOTOSIM_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            : "${PHOTOSIM_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
            : "${PHOTOSIM_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
            : "${PHOTOSIM_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
            umask 077
            export PHOTOSIM_KEYSTORE_FILE="$RUNNER_TEMP/photosim-signing.jks"
            trap 'rm -f "$PHOTOSIM_KEYSTORE_FILE"' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$PHOTOSIM_KEYSTORE_FILE"
          elif [[ "$RELEASE_TAG" == true ]]; then
            echo '::error::Release tags require all four Android signing secrets. See docs/releases.md.'
            exit 1
          fi
          python3 tool/build_release.py android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: build/dist/PhotoSim-*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, linux, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true
      - name: Publish complete release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
        working-directory: release
        run: |
          git -C "$GITHUB_WORKSPACE" archive --format=tar.gz --prefix="PhotoSim-$VERSION/" HEAD > "PhotoSim-$VERSION-source.tar.gz"
          # Fail before publishing if any expected platform artifact is absent.
          for suffix in x86_64.deb x86_64.pkg.tar.zst x86_64.AppImage armeabi-v7a.apk arm64-v8a.apk x86_64.apk; do
            test -s "PhotoSim-$VERSION-$suffix"
          done
          sha256sum PhotoSim-* > SHA256SUMS
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=(--verify-tag --generate-notes)
            if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${flags[@]}"
          fi
          gh release upload "$TAG" PhotoSim-* SHA256SUMS --clobber
