name: photosim
description: Landscape photography planner and simulator for Linux and Android.
publish_to: none
version: 1.1.0+2

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: 0.24.3
  hooks: 2.2.0
  flutter_map: 8.3.2
  latlong2: 0.10.1
  vector_math: 2.4.3
  http: 1.6.0
  image: 4.12.0
  path_provider: 2.1.6
  astronomia: 1.1.1
  lat_lng_to_timezone: 0.2.0
  timezone: 0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - flutter_scene_generated/
    - LICENSE
    - assets/sky/
    - assets/moon/
    - assets/terrain/
    - assets/atmosphere/cloud_noise.png
    - assets/fonts/OFL.txt
  fonts:
    - family: Source Sans 3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3-Medium.ttf
          weight: 500
        - asset: assets/fonts/SourceSans3-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700
