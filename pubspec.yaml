name: photosim
description: Landscape photography planner and simulator for Linux and Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.1'

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: 0.24.3
  flutter_map: 8.3.2
  latlong2: 0.10.1
  vector_math: 2.4.3
  http: 1.6.0
  image: 4.12.0
  path_provider: 2.1.6
  astronomia: 1.1.1
  lat_lng_to_timezone: 0.2.0
  timezone: 0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sky/
    - assets/terrain/
